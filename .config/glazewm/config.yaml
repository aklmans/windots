general:
  # Commands to run when the WM has started (e.g. to run a script or launch
  # another application). Here we are running a batch script to start Zebar.
  startup_commands: ["shell-exec C:\\Users\\Shadow\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\Scoop Apps\\YASB.lnk"]

  # Whether to automatically focus windows underneath the cursor.
  focus_follows_cursor: false

  # Whether to switch back and forth between the previously focused
  # workspace when focusing the current workspace.
  toggle_workspace_on_refocus: false

  cursor_jump:
    # Whether to automatically move the cursor on the specified trigger.
    enabled: true

    # Trigger for cursor jump:
    # - 'monitor_focus': Jump when focus changes between monitors.
    # - 'window_focus': Jump when focus changes between windows.
    trigger: "monitor_focus"

gaps:
  # Gap between adjacent windows.
  inner_gap: "15px"

  # Gap between windows and the screen edge.
  outer_gap:
    top: "10px"
    right: "15px"
    bottom: "15px"
    left: "15px"

window_effects:
  # Visual effects to apply to the focused window.
  focused_window:
    # Highlight the window with a colored border.
    # ** Exclusive to Windows 11 due to API limitations.
    border:
      enabled: true
      color: "#cba6f7"

  # Visual effects to apply to non-focused windows.
  other_windows:
    border:
      enabled: true
      color: "#6c7086"

window_behavior:
  # New windows are created in this state whenever possible.
  # Allowed values: 'tiling', 'floating'.
  initial_state: "tiling"

  # Sets the default options for when a new window is created. This also
  # changes the defaults for when the state change commands, like
  # `set-floating`, are used without any flags.
  state_defaults:
    floating:
      # Whether to center floating windows by default.
      centered: true

      # Whether to show floating windows as always on top.
      shown_on_top: false

    fullscreen:
      # Maximize the window if possible. If the window doesn't have a
      # maximize button, then it'll be fullscreen'ed normally instead.
      maximized: false

      # Whether to show fullscreen windows as always on top.
      shown_on_top: false

workspaces:
  - name: "1"
    display_name: "1 Warp"
    bind_to_monitor: 0
    keep_alive: true
  - name: "2"
    display_name: "2 Claude"
    bind_to_monitor: 0
    keep_alive: true
  - name: "3"
    display_name: "3 IDEA"
    bind_to_monitor: 0
    keep_alive: true
  - name: "4"
    display_name: "4 Edge"
    bind_to_monitor: 1
    keep_alive: true
  - name: "5"
    display_name: "5 Lark"
    bind_to_monitor: 1
    keep_alive: true
  - name: "6"
    display_name: "6 Typora"
    bind_to_monitor: 1
    keep_alive: true
  - name: "7"
    display_name: "7"
  - name: "8"
    display_name: "8"
  - name: "9"
    display_name: "9"

window_rules:
  - commands: ["ignore"]
    match:
      # Ignores any Zebar windows.
      - window_process: { equals: "zebar" }

      # Ignores picture-in-picture windows for browsers.
      - window_title: { regex: "[Pp]icture.in.[Pp]icture" }
        window_class: { regex: "Chrome_WidgetWin_1|MozillaDialogClass" }

      # Ignore rules for various 3rd-party apps.
      - window_process: { equals: "PowerToys.PowerAccent" }
      - window_process: { equals: "Lively" }
        window_class: { regex: "HwndWrapper*" }

      # Ignore all Linux GUI host windows
      - window_process: { equals: "msrdc" }

  # App-to-workspace mapping (desktop 1-6).
  - commands: ["move --workspace 1"]
    match:
      - window_process: { regex: "(?i)^warp$" }

  - commands: ["move --workspace 2"]
    match:
      - window_process: { regex: "(?i)^claude$" }

  - commands: ["move --workspace 3"]
    match:
      - window_process: { regex: "(?i)^idea64$" }

  - commands: ["move --workspace 4"]
    match:
      - window_process: { regex: "(?i)^msedge$" }

  - commands: ["move --workspace 5"]
    match:
      - window_process: { regex: "(?i)^lark$" }

  - commands: ["move --workspace 6"]
    match:
      - window_process: { regex: "(?i)^typora$" }

binding_modes:
  # When enabled, the focused window can be resized via arrow keys or HJKL.
  - name: "resize"
    keybindings:
      - commands: ["resize --width -2%"]
        bindings: ["h", "left"]
      - commands: ["resize --width +2%"]
        bindings: ["l", "right"]
      - commands: ["resize --height +2%"]
        bindings: ["k", "up"]
      - commands: ["resize --height -2%"]
        bindings: ["j", "down"]
      # Press enter/escape to return to default keybindings.
      - commands: ["wm-disable-binding-mode --name resize"]
        bindings: ["escape", "enter"]

  # When enabled, all keybindings are disabled except for alt+shift+p which
  # returns to default keybindings.
  - name: "pause"
    keybindings:
      - commands: ["wm-disable-binding-mode --name pause"]
        bindings: ["alt+shift+p"]

keybindings:
  # Shift focus in a given direction.
  - commands: ["focus --direction left"]
    bindings: ["alt+h", "alt+left"]
  - commands: ["focus --direction right"]
    bindings: ["alt+l", "alt+right"]
  - commands: ["focus --direction up"]
    bindings: ["alt+k", "alt+up"]
  - commands: ["focus --direction down"]
    bindings: ["alt+j", "alt+down"]

  # Move focused window in a given direction.
  - commands: ["move --direction left"]
    bindings: ["alt+shift+h", "alt+shift+left"]
  - commands: ["move --direction right"]
    bindings: ["alt+shift+l", "alt+shift+right"]
  - commands: ["move --direction up"]
    bindings: ["alt+shift+k", "alt+shift+up"]
  - commands: ["move --direction down"]
    bindings: ["alt+shift+j", "alt+shift+down"]

  # Resize focused window by a percentage or pixel amount.
  - commands: ["resize --width -2%"]
    bindings: ["alt+u"]
  - commands: ["resize --width +2%"]
    bindings: ["alt+p"]
  - commands: ["resize --height +2%"]
    bindings: ["alt+o"]
  - commands: ["resize --height -2%"]
    bindings: ["alt+i"]

  # As an alternative to the resize keybindings above, resize mode enables
  # resizing via arrow keys or HJKL. The binding mode is defined above with
  # the name 'resize'.
  - commands: ["wm-enable-binding-mode --name resize"]
    bindings: ["alt+r"]

  # Disables all keybindings until alt+shift+p is pressed again.
  - commands: ["wm-enable-binding-mode --name pause"]
    bindings: ["alt+shift+p"]

  # Change tiling direction. This determines where new tiling windows will be inserted.
  - commands: ["toggle-tiling-direction"]
    bindings: ["alt+v"]

  # Change focus from tiling windows -> floating -> fullscreen.
  - commands: ["wm-cycle-focus"]
    bindings: ["alt+space"]

  # Change the focused window to be floating.
  - commands: ["toggle-floating --centered"]
    bindings: ["alt+shift+space"]

  # Change the focused window to be tiling.
  - commands: ["toggle-tiling"]
    bindings: ["alt+t"]

  # Change the focused window to be fullscreen.
  - commands: ["toggle-fullscreen"]
    bindings: ["alt+f"]

  # Minimize focused window.
  - commands: ["toggle-minimized"]
    bindings: ["alt+m"]

  # Close focused window.
  - commands: ["close"]
    bindings: ["alt+q"]

  # Kill GlazeWM process safely.
  - commands: ["wm-exit"]
    bindings: ["alt+shift+e"]

  # Re-evaluate configuration file.
  - commands: ["wm-reload-config"]
    bindings: ["alt+shift+r"]

  # Redraw all windows.
  - commands: ["wm-redraw"]
    bindings: ["alt+shift+w"]

  # Focus the workspace that last had focus.
  - commands: ["focus --recent-workspace"]
    bindings: ["alt+`"]

  # Change focus by workspace order (left->right monitor layout + workspace order).
  - commands: ['shell-exec --hide-window powershell -NoProfile -ExecutionPolicy Bypass -File "C:\\Users\\Shadow\\.glzr\\glazewm\\focus-workspace-by-order.ps1" 1']
    bindings: ["ctrl+alt+1"]
  - commands: ['shell-exec --hide-window powershell -NoProfile -ExecutionPolicy Bypass -File "C:\\Users\\Shadow\\.glzr\\glazewm\\focus-workspace-by-order.ps1" 2']
    bindings: ["ctrl+alt+2"]
  - commands: ['shell-exec --hide-window powershell -NoProfile -ExecutionPolicy Bypass -File "C:\\Users\\Shadow\\.glzr\\glazewm\\focus-workspace-by-order.ps1" 3']
    bindings: ["ctrl+alt+3"]
  - commands: ['shell-exec --hide-window powershell -NoProfile -ExecutionPolicy Bypass -File "C:\\Users\\Shadow\\.glzr\\glazewm\\focus-workspace-by-order.ps1" 4']
    bindings: ["ctrl+alt+4"]
  - commands: ['shell-exec --hide-window powershell -NoProfile -ExecutionPolicy Bypass -File "C:\\Users\\Shadow\\.glzr\\glazewm\\focus-workspace-by-order.ps1" 5']
    bindings: ["ctrl+alt+5"]
  - commands: ['shell-exec --hide-window powershell -NoProfile -ExecutionPolicy Bypass -File "C:\\Users\\Shadow\\.glzr\\glazewm\\focus-workspace-by-order.ps1" 6']
    bindings: ["ctrl+alt+6"]
  - commands: ['shell-exec --hide-window powershell -NoProfile -ExecutionPolicy Bypass -File "C:\\Users\\Shadow\\.glzr\\glazewm\\focus-workspace-by-order.ps1" 7']
    bindings: ["ctrl+alt+7"]
  - commands: ['shell-exec --hide-window powershell -NoProfile -ExecutionPolicy Bypass -File "C:\\Users\\Shadow\\.glzr\\glazewm\\focus-workspace-by-order.ps1" 8']
    bindings: ["ctrl+alt+8"]
  - commands: ['shell-exec --hide-window powershell -NoProfile -ExecutionPolicy Bypass -File "C:\\Users\\Shadow\\.glzr\\glazewm\\focus-workspace-by-order.ps1" 9']
    bindings: ["ctrl+alt+9"]

  # Cycle workspaces.
  - commands: ["focus --prev-active-workspace-on-monitor"]
    bindings: ["ctrl+alt+left"]
  - commands: ["focus --next-active-workspace-on-monitor"]
    bindings: ["ctrl+alt+right"]

  # Open Task View.
  - commands: ['shell-exec explorer "shell:::{3080F90E-D7AD-11D9-BD98-0000947B0257}"']
    bindings: ["ctrl+alt+up", "ctrl+alt+down"]

  # Move the focused window's parent workspace to a monitor in a given direction.
  - commands: ["move-workspace --direction left"]
    bindings: ["alt+shift+a"]
  - commands: ["move-workspace --direction right"]
    bindings: ["alt+shift+f"]
  - commands: ["move-workspace --direction up"]
    bindings: ["alt+shift+d"]
  - commands: ["move-workspace --direction down"]
    bindings: ["alt+shift+s"]

  # Move current workspace to a target monitor (dual-screen quick actions).
  - commands: ["move-workspace --direction left"]
    bindings: ["ctrl+alt+shift+1"]
  - commands: ["move-workspace --direction right"]
    bindings: ["ctrl+alt+shift+2"]

  # Move focused window to a workspace defined in `workspaces` config.
  - commands: ["move --workspace 1", "focus --workspace 1"]
    bindings: ["alt+shift+1"]
  - commands: ["move --workspace 2", "focus --workspace 2"]
    bindings: ["alt+shift+2"]
  - commands: ["move --workspace 3", "focus --workspace 3"]
    bindings: ["alt+shift+3"]
  - commands: ["move --workspace 4", "focus --workspace 4"]
    bindings: ["alt+shift+4"]
  - commands: ["move --workspace 5", "focus --workspace 5"]
    bindings: ["alt+shift+5"]
  - commands: ["move --workspace 6", "focus --workspace 6"]
    bindings: ["alt+shift+6"]
  - commands: ["move --workspace 7", "focus --workspace 7"]
    bindings: ["alt+shift+7"]
  - commands: ["move --workspace 8", "focus --workspace 8"]
    bindings: ["alt+shift+8"]
  - commands: ["move --workspace 9", "focus --workspace 9"]
    bindings: ["alt+shift+9"]

  # Custom keybindings for applications

  # Open Windows Terminal wsl profile
  - commands: ["shell-exec wt"]
    bindings: ["alt+enter"]

  # Open Windows Terminal PowerShell profile
  - commands: ['shell-exec wt --profile "Windows PowerShell"']
